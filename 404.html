<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
    }

    .container {
      text-align: center;
      padding: 40px 24px;
    }

    .code {
      font-size: 7rem;
      font-weight: 800;
      color: #e5e7eb;
      line-height: 1;
      letter-spacing: -4px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 16px;
      color: #111827;
    }

    p {
      font-size: 0.9375rem;
      color: #6b7280;
      margin-top: 8px;
    }

    a {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 24px;
      background: #111827;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.15s;
    }

    a:hover { background: #374151; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Go back home</a>
  </div>
</body>
</html>
